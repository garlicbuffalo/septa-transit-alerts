<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background; the OS applies the mask shape, so no rounded
       corners here. Grid sits inside the central ~60% safe zone so it
       survives the circular crop on Android. -->
  <rect width="512" height="512" fill="#0d1117"/>
  <!-- L1 (Market-Frankford) row -->
  <rect x="102" y="144" width="56" height="56" rx="14" fill="#30363d"/>
  <rect x="186" y="144" width="56" height="56" rx="14" fill="#0097D6"/>
  <rect x="270" y="144" width="56" height="56" rx="14" fill="#30363d"/>
  <rect x="354" y="144" width="56" height="56" rx="14" fill="#0097D6" opacity="0.5"/>
  <!-- B (Broad Street) row -->
  <rect x="102" y="228" width="56" height="56" rx="14" fill="#F26100"/>
  <rect x="186" y="228" width="56" height="56" rx="14" fill="#30363d"/>
  <rect x="270" y="228" width="56" height="56" rx="14" fill="#F26100" opacity="0.5"/>
  <rect x="354" y="228" width="56" height="56" rx="14" fill="#30363d"/>
  <!-- T (trolley) row -->
  <rect x="102" y="312" width="56" height="56" rx="14" fill="#30363d"/>
  <rect x="186" y="312" width="56" height="56" rx="14" fill="#30363d"/>
  <rect x="270" y="312" width="56" height="56" rx="14" fill="#5A960A"/>
  <rect x="354" y="312" width="56" height="56" rx="14" fill="#30363d"/>
</svg>
