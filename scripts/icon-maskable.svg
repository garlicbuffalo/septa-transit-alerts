<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!-- Full-bleed background; the OS applies the mask shape, so no rounded
       corners here. The favicon drawing is scaled to 72% so it sits inside the
       central safe zone and survives the circular crop on Android. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#bg)"/>
  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <g stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9.5 28v-9l4-3" stroke="#5A960A"/>
      <path d="M16 28V18" stroke="#F26100"/>
      <path d="M22.5 28v-9l-4-3" stroke="#0097D6"/>
    </g>
    <circle cx="16" cy="14" r="4" fill="#0d1117" stroke="#FFD700" stroke-width="2.3"/>
    <path d="M16 14v-2M16 14h1.5" stroke="#FFD700" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M12.6 9.2C12.6 6.6 14.2 5.6 16 4.6 17.8 5.6 19.4 6.6 19.4 9.2Z" fill="#FFD700" stroke="#161c26" stroke-width="1"/>
    <rect x="15.25" y="1.8" width="1.5" height="3.6" rx=".75" fill="#FFD700"/>
  </g>
</svg>
