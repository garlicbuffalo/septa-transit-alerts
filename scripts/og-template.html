<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      /* The wordmark's display face, inlined as a data: URI by
         scripts/render-brand-assets.js (the card renders offline). */
      @font-face {
        font-family: 'Overpass Variable';
        font-weight: 100 900;
        src: url(__BRAND_FONT__) format('woff2-variations');
      }
      :root {
        --l1: #0097d6;
        --b: #f26100;
        --m1: #5f249f;
        --t: #5a960a;
        --g1: #e6c200;
        --d: #dc2e6b;
        --rr: #4f758b;
        --bus: #475569;
      }
      * {
        box-sizing: border-box;
      }
      /* Laid out at 1024×538 and rendered at a 1200/1024 device scale by
         scripts/render-brand-assets.js, giving a 1200×630 PNG. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 538px;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1024px;
        height: 538px;
        background:
          linear-gradient(
            90deg,
            rgba(242, 97, 0, 0.16) 0%,
            rgba(95, 36, 159, 0.12) 35%,
            rgba(0, 151, 214, 0.22) 100%
          ),
          radial-gradient(ellipse at top, rgba(0, 151, 214, 0.18) 0%, transparent 70%),
          #f8fafc;
        padding: 38px 56px 28px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #e2e8f0;
        color: #475569;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        align-self: flex-start;
      }
      .badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
      }
      .body-row {
        display: flex;
        gap: 48px;
        flex: 1;
        margin-top: 18px;
        align-items: flex-start;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0 0 18px;
      }
      .lockup svg {
        width: 76px;
        height: 76px;
        flex-shrink: 0;
        border-radius: 17px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
      }
      .title {
        font-family: 'Overpass Variable', sans-serif;
        font-size: 60px;
        line-height: 0.95;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .title .product {
        font-weight: 500;
        color: #475569;
      }
      .subtitle {
        font-size: 19px;
        line-height: 1.4;
        color: #475569;
        font-weight: 400;
        margin: 0;
      }
      .heatmap {
        display: grid;
        grid-template-columns: 48px repeat(12, 1fr);
        gap: 4px;
        align-items: center;
        width: 392px;
        flex-shrink: 0;
      }
      .heatmap .label {
        font-size: 11px;
        font-weight: 700;
        color: #334155;
        text-align: right;
        padding-right: 5px;
      }
      .cell {
        aspect-ratio: 1 / 1;
        border-radius: 3px;
        background: #e2e8f0;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 20px;
      }
      .url {
        font-size: 19px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: -0.01em;
      }
      .url .scheme {
        color: #94a3b8;
        font-weight: 400;
      }
      .tag {
        font-size: 11px;
        color: #64748b;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><span class="dot"></span>Live archive</div>

      <div class="body-row">
        <div class="copy">
          <div class="lockup">
            <!-- Same drawing as public/favicon.svg. -->
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1c2330" />
                  <stop offset="1" stop-color="#0d1117" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="14" fill="url(#bg)" />
              <!-- City Hall's roofline, in the Regional Rail slate -->
              <path d="M10 58h44" stroke="#4F758B" stroke-width="4" stroke-linecap="round" />
              <!-- The building: L1, B, and T lines rising and converging under the tower -->
              <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M17 55v-6l15-6" stroke="#5A960A" />
                <path d="M47 55v-6l-15-6" stroke="#0097D6" />
                <path d="M32 55V43" stroke="#F26100" />
              </g>
              <!-- Windows -->
              <g fill="#0d1117">
                <rect x="16.3" y="50.5" width="1.4" height="3" rx=".7" />
                <rect x="31.3" y="48.5" width="1.4" height="3" rx=".7" />
                <rect x="46.3" y="50.5" width="1.4" height="3" rx=".7" />
              </g>
              <!-- The tower shaft, one narrow line up to the clock -->
              <path d="M32 43V35" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
              <!-- Clock face -->
              <circle cx="32" cy="28" r="6.2" fill="#0d1117" stroke="#FFD700" stroke-width="3.6" />
              <g stroke="#FFD700" stroke-linecap="round">
                <path d="M32 23.4v1M36.6 28h-1M32 32.6v-1M27.4 28h1" stroke-width=".95" />
                <path d="M32 28v-3M32 28h2.4" stroke-width="1.3" />
              </g>
              <!-- Drum with arched windows, ribbed dome, lantern -->
              <rect x="27" y="16" width="10" height="3.6" rx=".6" fill="#FFD700" />
              <g fill="#0d1117">
                <rect x="28.7" y="16.6" width="1.3" height="2.3" rx=".65" />
                <rect x="31.35" y="16.6" width="1.3" height="2.3" rx=".65" />
                <rect x="34" y="16.6" width="1.3" height="2.3" rx=".65" />
              </g>
              <path d="M26 15.2C26 11.4 29.4 10.2 32 8.2 34.6 10.2 38 11.4 38 15.2Z" fill="#FFD700" />
              <path d="M32 9v6.2M29.2 15.2c.3-2.3 1.2-3.7 2.8-5M34.8 15.2c-.3-2.3-1.2-3.7-2.8-5" stroke="#0d1117" stroke-width=".7" fill="none" />
              <rect x="30.85" y="6.2" width="2.3" height="2.5" rx=".5" fill="#FFD700" />
              <!-- William Penn -->
              <g fill="#FFD700">
                <rect x="30.45" y="2.15" width="3.1" height=".8" rx=".4" />
                <rect x="31.1" y=".9" width="1.8" height="1.6" rx=".5" />
                <circle cx="32" cy="3.75" r=".9" />
                <path d="M31 4.6h2l.35 1.8h-2.7z" />
              </g>
              <path d="M32.85 5l2.4.6" stroke="#FFD700" stroke-width=".8" stroke-linecap="round" />
            </svg>
            <h1 class="title">SEPTA<br /><span class="product">Transit Alerts</span></h1>
          </div>
          <p class="subtitle">
            A public archive of SEPTA service alerts and detected disruptions across Metro, buses,
            and Regional Rail.
          </p>
        </div>

        <div class="heatmap">
          <div class="label">L1</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.95;"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.85;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">B lines</div>
          <div class="cell" style="background: var(--b); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.95;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.6;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.85;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.5;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.9;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.65;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.4;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.75;"></div>

          <div class="label">M1</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.4;"></div>
          <div class="cell"></div>

          <div class="label">Trolley</div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.7;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--t); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.75;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">G1</div>
          <div class="cell" style="background: var(--g1); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.45;"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.7;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.65;"></div>

          <div class="label">D lines</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">Rail</div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.4;"></div>

          <div class="label">Buses</div>
          <div class="cell" style="background: var(--bus); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.8;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.65;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.9;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.45;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.6;"></div>
        </div>
      </div>

      <div class="footer">
        <div class="url">
          <span class="scheme">https://</span>__SITE_HOST__
        </div>
        <div class="tag">Unofficial · Not affiliated with SEPTA</div>
      </div>
    </div>
  </body>
</html>
