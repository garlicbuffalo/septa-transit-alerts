<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      /* The wordmark's display face, inlined as a data: URI by
         scripts/render-brand-assets.js (the card renders offline). */
      @font-face {
        font-family: 'Overpass Variable';
        font-weight: 100 900;
        src: url(__BRAND_FONT__) format('woff2-variations');
      }
      :root {
        --l1: #0097d6;
        --b: #f26100;
        --m1: #5f249f;
        --t: #5a960a;
        --g1: #e6c200;
        --d: #dc2e6b;
        --rr: #4f758b;
        --bus: #475569;
      }
      * {
        box-sizing: border-box;
      }
      /* Laid out at 1024×538 and rendered at a 1200/1024 device scale by
         scripts/render-brand-assets.js, giving a 1200×630 PNG. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 538px;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1024px;
        height: 538px;
        background:
          linear-gradient(
            90deg,
            rgba(242, 97, 0, 0.16) 0%,
            rgba(95, 36, 159, 0.12) 35%,
            rgba(0, 151, 214, 0.22) 100%
          ),
          radial-gradient(ellipse at top, rgba(0, 151, 214, 0.18) 0%, transparent 70%),
          #f8fafc;
        padding: 38px 56px 28px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #e2e8f0;
        color: #475569;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        align-self: flex-start;
      }
      .badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
      }
      .body-row {
        display: flex;
        gap: 48px;
        flex: 1;
        margin-top: 18px;
        align-items: flex-start;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0 0 18px;
      }
      .lockup svg {
        width: 76px;
        height: 76px;
        flex-shrink: 0;
        border-radius: 17px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
      }
      .title {
        font-family: 'Overpass Variable', sans-serif;
        font-size: 60px;
        line-height: 0.95;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .title .product {
        font-weight: 500;
        color: #475569;
      }
      .subtitle {
        font-size: 19px;
        line-height: 1.4;
        color: #475569;
        font-weight: 400;
        margin: 0;
      }
      .heatmap {
        display: grid;
        grid-template-columns: 48px repeat(12, 1fr);
        gap: 4px;
        align-items: center;
        width: 392px;
        flex-shrink: 0;
      }
      .heatmap .label {
        font-size: 11px;
        font-weight: 700;
        color: #334155;
        text-align: right;
        padding-right: 5px;
      }
      .cell {
        aspect-ratio: 1 / 1;
        border-radius: 3px;
        background: #e2e8f0;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 20px;
      }
      .url {
        font-size: 19px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: -0.01em;
      }
      .url .scheme {
        color: #94a3b8;
        font-weight: 400;
      }
      .tag {
        font-size: 11px;
        color: #64748b;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><span class="dot"></span>Live archive</div>

      <div class="body-row">
        <div class="copy">
          <div class="lockup">
            <!-- Same drawing as public/favicon.svg. -->
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1c2330" />
                  <stop offset="1" stop-color="#0d1117" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="14" fill="url(#bg)" />
              <!-- City Hall's roofline, in the Regional Rail slate -->
              <path d="M11 57h42" stroke="#4F758B" stroke-width="4" stroke-linecap="round" />
              <!-- The shaft: L1, B, and T lines rising to meet at the clock -->
              <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M20 54V40l7.5-5.5" stroke="#5A960A" />
                <path d="M32 54V37" stroke="#F26100" />
                <path d="M44 54V40l-7.5-5.5" stroke="#0097D6" />
              </g>
              <!-- Shaft windows -->
              <g fill="#0d1117">
                <rect x="19.3" y="42.5" width="1.4" height="3" rx=".7" />
                <rect x="19.3" y="48" width="1.4" height="3" rx=".7" />
                <rect x="31.3" y="41" width="1.4" height="3" rx=".7" />
                <rect x="31.3" y="46.5" width="1.4" height="3" rx=".7" />
                <rect x="43.3" y="42.5" width="1.4" height="3" rx=".7" />
                <rect x="43.3" y="48" width="1.4" height="3" rx=".7" />
              </g>
              <!-- Clock face -->
              <circle cx="32" cy="30" r="6.6" fill="#0d1117" stroke="#FFD700" stroke-width="3.8" />
              <g stroke="#FFD700" stroke-linecap="round">
                <path d="M32 25.1v1.1M36.9 30h-1.1M32 34.9v-1.1M27.1 30h1.1" stroke-width="1" />
                <path d="M32 30v-3.2M32 30h2.5" stroke-width="1.4" />
              </g>
              <!-- Drum with arched windows, ribbed dome, lantern -->
              <rect x="26.6" y="17.4" width="10.8" height="3.8" rx=".6" fill="#FFD700" />
              <g fill="#0d1117">
                <rect x="28.4" y="18.1" width="1.4" height="2.4" rx=".7" />
                <rect x="31.3" y="18.1" width="1.4" height="2.4" rx=".7" />
                <rect x="34.2" y="18.1" width="1.4" height="2.4" rx=".7" />
              </g>
              <path d="M25.6 16.6C25.6 12.6 29.2 11.4 32 9.4 34.8 11.4 38.4 12.6 38.4 16.6Z" fill="#FFD700" />
              <path d="M32 10.2v6.4M29 16.6c.3-2.4 1.3-3.9 3-5.2M35 16.6c-.3-2.4-1.3-3.9-3-5.2" stroke="#0d1117" stroke-width=".75" fill="none" />
              <rect x="30.8" y="7" width="2.4" height="2.8" rx=".5" fill="#FFD700" />
              <!-- William Penn -->
              <g fill="#FFD700">
                <rect x="30.4" y="2.6" width="3.2" height=".85" rx=".42" />
                <rect x="31.05" y="1.3" width="1.9" height="1.7" rx=".5" />
                <circle cx="32" cy="4.3" r=".95" />
                <path d="M30.95 5.2h2.1l.35 2h-2.8z" />
              </g>
              <path d="M32.9 5.6l2.5.6" stroke="#FFD700" stroke-width=".85" stroke-linecap="round" />
            </svg>
            <h1 class="title">SEPTA<br /><span class="product">Transit Alerts</span></h1>
          </div>
          <p class="subtitle">
            A public archive of SEPTA service alerts and detected disruptions across Metro, buses,
            and Regional Rail.
          </p>
        </div>

        <div class="heatmap">
          <div class="label">L1</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.95;"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.85;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--l1); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">B lines</div>
          <div class="cell" style="background: var(--b); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.95;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.6;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.85;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.5;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.9;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--b); opacity: 0.65;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.4;"></div>
          <div class="cell" style="background: var(--b); opacity: 0.75;"></div>

          <div class="label">M1</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--m1); opacity: 0.4;"></div>
          <div class="cell"></div>

          <div class="label">Trolley</div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.7;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--t); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.75;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--t); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">G1</div>
          <div class="cell" style="background: var(--g1); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.45;"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.7;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--g1); opacity: 0.65;"></div>

          <div class="label">D lines</div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.55;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--d); opacity: 0.5;"></div>
          <div class="cell"></div>

          <div class="label">Rail</div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.6;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.45;"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--rr); opacity: 0.4;"></div>

          <div class="label">Buses</div>
          <div class="cell" style="background: var(--bus); opacity: 0.55;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.8;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.65;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.4;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.9;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.5;"></div>
          <div class="cell"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.7;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.45;"></div>
          <div class="cell" style="background: var(--bus); opacity: 0.6;"></div>
        </div>
      </div>

      <div class="footer">
        <div class="url">
          <span class="scheme">https://</span>__SITE_HOST__
        </div>
        <div class="tag">Unofficial · Not affiliated with SEPTA</div>
      </div>
    </div>
  </body>
</html>
