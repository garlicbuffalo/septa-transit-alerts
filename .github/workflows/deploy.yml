name: Deploy to GitHub Pages

on:
  # Real code changes — run the full gate (tests + lint) before deploying.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - '.github/workflows/deploy.yml'
  # Data refreshes. collect.yml dispatches this workflow whenever the collector
  # sees a rider-visible change and at least every 30 minutes otherwise (running
  # delay figures, "updated" timestamps); the schedule below is the backstop for
  # when the collector isn't running on Actions or a dispatch is missed. Both
  # rebuild with the latest `data` branch snapshot and skip tests/lint, since
  # the code was already gated when it landed on main.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  should-deploy:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: skip if a push or dispatched deploy of this commit
          # finished in the last 20 minutes — the data it shipped is still fresh.
          runs_json="$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?status=success&per_page=20")"
          recent_id="$(
            printf '%s' "$runs_json" \
              | jq -r --arg sha "$SHA" '
                  now as $now
                  | .workflow_runs[]
                  | select(.event == "push" or .event == "workflow_dispatch")
                  | select(.head_sha == $sha)
                  | select(($now - (.updated_at | fromdateiso8601)) < 1200)
                  | .id
                ' \
              | head -n 1
          )"

          if [ -n "$recent_id" ]; then
            echo "Skipping scheduled rebuild: run $recent_id deployed SHA $SHA in the last 20 minutes."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: should-deploy
    if: needs.should-deploy.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate only real code changes. Data-driven rebuilds (dispatch / schedule)
      # re-run already-green code with fresh data, so the tests/lint would just
      # be wasted minutes.
      - if: github.event_name == 'push'
        run: npm test -- --run

      - if: github.event_name == 'push'
        run: npm run lint

      # The collector's output lives on the `data` branch (collect.yml).
      - name: Look for collected data
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/data" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No data branch yet, so the site deploys with an empty dataset. Run the 'Collect SEPTA data' workflow to start collecting."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.data.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: data
          path: data-branch
          persist-credentials: false

      - run: sudo apt-get install -y fonts-inter

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restore OG image cache
        uses: actions/cache@v5
        with:
          path: |
            .og-cache
            .og-cache-pages
          key: og-cache-${{ github.run_id }}
          restore-keys: |
            og-cache-

      # `prebuild` (scripts/fetch-data.js) copies the data branch into
      # public/data/, so the deployed site serves it same-origin at /data/ and
      # the postbuild steps (OG cards, feeds, sitemap, CSV) see the same data.
      #
      # Repository variables (Settings → Secrets and variables → Actions →
      # Variables):
      #   SITE_URL       the site's public origin, e.g. https://septa.example.org
      #   DATA_BASE_URL  optional: serve data from another origin instead of
      #                  /data (e.g. raw.githubusercontent.com for the data
      #                  branch, so the live site updates without a redeploy)
      #   BLUESKY_HANDLES optional: the bot accounts' handles, which turns on
      #                  the site's "Follow on Bluesky" links, as
      #                  "alerts=handle,metro=handle,bus=handle,rail=handle"
      - run: npm run build
        env:
          DATA_DIR: ${{ steps.data.outputs.exists == 'true' && format('{0}/data-branch', github.workspace) || '' }}
          SITE_URL: ${{ vars.SITE_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          BLUESKY_HANDLES: ${{ vars.BLUESKY_HANDLES }}
          VITE_BLUESKY_HANDLES: ${{ vars.BLUESKY_HANDLES }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Ship dotfiles so /.well-known/ (security.txt, api-catalog) deploys;
          # the action excludes hidden paths by default.
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
