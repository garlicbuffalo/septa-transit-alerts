name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --run

  # The bot service (bot/) is its own package with native dependencies
  # (sharp, better-sqlite3); its tests run against the collector's fixtures and
  # never touch the network.
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - run: sudo apt-get install -y fonts-inter

      - run: npm ci

      - run: npm ci --prefix bot

      - run: npm run test:bot

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

  # Smoke-build the site on every PR. `npm test`/`npm run lint` never exercise
  # `npm run build`, so a crash in the postbuild scripts (prerender-events,
  # prerender-pages, generate-feed, generate-sitemap, generate-csv) would only
  # surface in deploy.yml after merge — which can freeze the live site. The
  # build runs against a data directory the collector builds from its test
  # fixtures, so every postbuild script sees real-shaped incidents.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: sudo apt-get install -y fonts-inter

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Read-only restore of deploy.yml's OG render cache so PR builds reuse
      # already-rendered event/page PNGs instead of re-rendering all of them
      # cold. A miss just means a slower build, never a failure.
      - name: Restore OG image cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .og-cache
            .og-cache-pages
          key: og-cache-pr-${{ github.run_id }}
          restore-keys: |
            og-cache-

      # Pinned to the fixtures' capture time (see collector/test/collector.test.js).
      - name: Build sample data from the collector fixtures
        run: >-
          node collector/collect.js
          --data-dir "$RUNNER_TEMP/sample-data"
          --fixtures collector/test/fixtures
          --now 1791244200000

      - run: npm run build
        env:
          DATA_DIR: ${{ runner.temp }}/sample-data
