<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">
  <!-- Same drawing as favicon.svg, square-cornered: iOS applies its own mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <!-- City Hall's roofline, in the Regional Rail slate -->
  <path d="M10 58h44" stroke="#4F758B" stroke-width="4" stroke-linecap="round"/>
  <!-- The building: L1, B, and T lines rising and converging under the tower -->
  <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M17 55v-6l15-6" stroke="#5A960A"/>
    <path d="M47 55v-6l-15-6" stroke="#0097D6"/>
    <path d="M32 55V43" stroke="#F26100"/>
  </g>
  <!-- Windows -->
  <g fill="#0d1117">
    <rect x="16.3" y="50.5" width="1.4" height="3" rx=".7"/>
    <rect x="31.3" y="48.5" width="1.4" height="3" rx=".7"/>
    <rect x="46.3" y="50.5" width="1.4" height="3" rx=".7"/>
  </g>
  <!-- The tower shaft, one yellow line up to the clock -->
  <path d="M32 41V34.3" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <rect x="31.4" y="35.9" width="1.2" height="2.6" rx=".6" fill="#0d1117"/>
  <!-- Clock face -->
  <circle cx="32" cy="28" r="5.6" fill="#0d1117" stroke="#FFD700" stroke-width="3.4"/>
  <g stroke="#FFD700" stroke-linecap="round">
    <path d="M32 22.9v.9M37.1 28h-.9M32 33.1v-.9M26.9 28h.9" stroke-width=".9"/>
    <path d="M32 28v-2.8M32 28h2.2" stroke-width="1.2"/>
  </g>
  <!-- Drum with arched windows, ribbed dome, lantern -->
  <rect x="27" y="16.9" width="10" height="3.4" rx=".6" fill="#FFD700"/>
  <g fill="#0d1117">
    <rect x="28.6" y="17.5" width="1.2" height="2.2" rx=".6"/>
    <rect x="31.4" y="17.5" width="1.2" height="2.2" rx=".6"/>
    <rect x="34.1" y="17.5" width="1.2" height="2.2" rx=".6"/>
  </g>
  <path d="M26.4 16.1C26.4 12.5 29.6 11.2 32 9.5 34.4 11.2 37.6 12.5 37.6 16.1Z" fill="#FFD700"/>
  <path d="M32 10.3V16.1M29.3 16.1c.3-2.2 1.1-3.6 2.69-4.8M34.7 16.1c-.3-2.2-1.1-3.6-2.69-4.8" stroke="#0d1117" stroke-width=".65" fill="none"/>
  <rect x="30.9" y="7.5" width="2.2" height="2.4" rx=".5" fill="#FFD700"/>
  <!-- William Penn -->
  <g fill="#FFD700">
    <rect x="30.5" y="3.45" width="3" height=".8" rx=".4"/>
    <rect x="31.1" y="2.2" width="1.8" height="1.6" rx=".5"/>
    <circle cx="32" cy="5.05" r=".9"/>
    <path d="M31 5.9h2l.35 1.8h-2.7z"/>
  </g>
  <path d="M32.85 6.3l2.4.6" stroke="#FFD700" stroke-width=".8" stroke-linecap="round"/>
</svg>
