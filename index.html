    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches the header background, so the browser / installed-app status
         bar reads as part of the app bar. useDarkMode keeps it in sync with
         the in-app toggle. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved/preferred color scheme synchronously, before first
         paint, so full-page navigations don't flash a light frame before the
         app's JS mounts and toggles the class (dark-mode FOUC). Mirrors the
         initial-state logic in src/hooks/useDarkMode.js; that hook still owns
         the class once React mounts. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('darkMode');
          const dark =
            stored === null
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : stored === 'true';
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch {
          /* localStorage blocked (private mode) — fall back to light. */
        }
      })();
    </script>

  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Speculation Rules: pages use full-page navigation (no client router),
         so prefetching same-origin links on hover makes clicks much faster,
         and prerendering the hub pages makes them feel instant. /data/* (the
         JSON/CSV API) is excluded from document prefetch. -->
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/data/*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ],
        "prerender": [
          {
            "source": "list",
            "urls": ["/", "/calendar", "/stats"],
            "eagerness": "moderate"
          }
        ]
      }
    </script>
